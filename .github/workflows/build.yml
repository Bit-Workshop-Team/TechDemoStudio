name: build

# CD：构建 Windows 安装包，并在打 v* 标签时自动发版。
# 日常提交的逻辑验证由 test.yml 负责；这里在构建前再自检一遍，避免用坏代码出包。
# 触发：打 tag（发版）、手动触发。想验证提交请用 test.yml。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # CI 上不发布到任何商店，产物交给 artifact / Release
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # 构建前的把关：不通过就不出包
  verify:
    name: 逻辑自检 (node tools/self-test.js)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 规则 / 棋盘文本 / 提示词 / 请求体 / 配置 / 暗码 自检
        run: npm test

  build:
    name: 构建 Windows 安装包 (NSIS)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 缓存 Electron / electron-builder 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 生成应用图标（build/icon*.png 与 icon.ico 不入库）
        run: npm run icon

      - name: 构建 x64 + ia32 安装包
        run: npm run dist -- --publish never

      - name: 列出版本信息与产物
        run: |
          node -p "'electron=' + require('electron/package.json').version"
          Get-ChildItem dist\*.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: TechDemoStudio-installers
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/TechDemoStudio-*-setup.exe
            dist/*.blockmap

      - name: 上传应用本体（便于排查，不含 Electron 运行时）
        uses: actions/upload-artifact@v4
        with:
          name: TechDemoStudio-win-unpacked-app
          if-no-files-found: warn
          retention-days: 7
          path: |
            dist/win-unpacked/TechDemoStudio.exe
            dist/win-unpacked/resources/app.asar
            dist/win-unpacked/resources/app.asar.unpacked/**

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # 创建 Release 需要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TechDemoStudio-installers
          path: installers

      - name: 生成校验和
        shell: bash
        run: |
          cd installers
          ls -l
          sha256sum ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release 并附加安装包
        uses: softprops/action-gh-release@v2
        with:
          name: 技术演示台 ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            installers/*.exe
            installers/SHA256SUMS.txt
